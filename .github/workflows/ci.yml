name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Bản Node thấp nhất còn hỗ trợ (22) + bản mới nhất (26) trên Ubuntu;
        # macOS/Windows chỉ cần bản mới nhất để bắt lỗi theo hệ điều hành.
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 26 }
          - { os: macos-latest, node: 26 }
          - { os: windows-latest, node: 26 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
